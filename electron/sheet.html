<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src https: data:;" />
    <link rel="stylesheet" href="sheet.css" />
    <title>Character</title>
  </head>
  <body>
    <header class="top">
      <div id="loader">
        <div id="charPicker" hidden>
          <button id="charPickerBtn" type="button" title="Your D&amp;D Beyond characters">
            <span id="charPickerLabel">Select a character…</span><span class="cp-caret">▾</span>
          </button>
          <div id="charPickerList" hidden></div>
        </div>
        <input id="charId" type="text" placeholder="D&amp;D Beyond character ID" />
        <button id="loadBtn">Load</button>
        <button id="charRefresh" class="mini-btn" title="Reload your character list" hidden>⟳</button>
      </div>
      <div id="status" class="status"></div>
      <div class="toolbar">
        <div class="pane-group">
          <div class="seg" id="paneSeg">
            <button data-pane="roll20" class="on">Table</button>
            <button data-pane="ddb">D&amp;D Beyond</button>
            <button data-pane="notebook" title="Notebook — notes for the campaign currently open in Roll20" aria-label="Notebook">📓</button>
          </div>
          <button id="dexBtn" class="dex-btn" hidden title="Pokédex — browse species, stat blocks, moves, evolution, catch odds" aria-label="Open the Pokédex"><span class="d-scr"></span></button>
        </div>
        <span id="ddbStatus" class="ddb-status" title="Slot sync with D&amp;D Beyond — click to re-check">DDB —</span>
        <button id="logoutBtn" class="mini-btn" title="Return to the setup menu — change character source or VTT">⇦ Menu</button>
      </div>
    </header>

    <div id="stabNote" class="stab-note" hidden role="status" aria-live="polite">
      <span class="sn-ico">⚔️</span><span class="sn-txt"></span><button class="sn-x" title="Dismiss" aria-label="Dismiss">✕</button>
    </div>

    <div id="sheet" hidden>
      <div class="ident">
        <div class="name-row">
          <h1 id="charName"></h1>
          <button id="rosterToggle" class="roster-toggle" title="Switch character" aria-haspopup="listbox" aria-expanded="false" hidden>▾</button>
          <span id="roMode" class="ro-badge" title="You don't own this sheet — rolls work and HP/resources track locally, but nothing writes back to the source" hidden>Read-only</span>
          <div id="rosterMenu" class="roster-menu" role="listbox" hidden></div>
          <!-- Character actions live in one overflow menu; destructive ones sit apart at the bottom. -->
          <span class="dd more-wrap">
            <button id="moreBtn" class="more-btn" data-dd="more" title="Character actions" aria-haspopup="menu">⋯</button>
            <div id="dd-more" class="dd-menu" role="menu" hidden>
              <button id="reloadChar" class="mm-item" title="Pick up changes made elsewhere, e.g. on poke5e" hidden>↻ Reload from source</button>
              <button id="exportPdfBtn" class="mm-item" title="Export a printable character-sheet PDF">📄 Export PDF</button>
              <button id="bindToken" class="mm-item" title="Bind HP to a specific Roll20 token — so multiple same-named NPCs track separately">⚔ Bind token</button>
              <button id="restorePpBtn" class="mm-item" title="Use an Ether/Elixir from the trainer's bag to restore move PP" hidden>🧪 Restore PP</button>
              <button id="keysBtn" class="mm-item" title="Show / copy this trainer's poke5e read + write keys so you can back them up" hidden>🔑 Show keys</button>
              <hr class="mm-sep" />
              <button id="removeTrainerBtn" class="mm-item" title="Remove this trainer from your list (stays in poke5e; re-add with its read key)" hidden>✕ Remove from my list</button>
              <button id="deleteTrainerBtn" class="mm-item danger" title="Permanently delete this trainer from poke5e" hidden>🗑 Delete permanently…</button>
            </div>
          </span>
        </div>
        <div id="meta" class="meta"></div>
        <div id="evoBar" class="evo-bar" hidden>
          <button id="evolveBtn" class="evolve-btn" hidden>✨ Evolve</button>
          <div id="asiBanner" class="asi-banner" hidden></div>
        </div>
        <div id="expBar" class="exp-bar" hidden></div>
        <div id="vitals" class="vitals"></div>
        <div id="conditions" class="conditions">
          <span id="condActive" class="cond-active"></span>
          <span class="cond-add-wrap">
            <button id="condAddBtn" class="cond-add" title="Add or remove conditions">＋ Condition</button>
            <div id="condList" class="cond-list" hidden></div>
          </span>
          <span class="dd" id="restWrap" hidden>
            <button id="restMenuBtn" class="cond-add rest-chip" data-dd="rest" title="Short or long rest">🌙 Rest ▾</button>
            <div id="dd-rest" class="dd-menu rest-pop" role="menu" hidden>
              <!-- D&D Beyond: Hit Dice to spend, then commit with Short rest. -->
              <div data-section="rests" hidden>
                <div class="rp-head">Hit Dice <span id="restMeta" class="spell-meta"></span></div>
                <div id="hitDice" class="hitdice"></div>
                <hr class="mm-sep" />
              </div>
              <button id="shortRest" class="mm-item">🌗 Short rest <small>commit spent Hit Dice</small></button>
              <button id="longRest" class="mm-item">🌙 Long rest <small>HP, slots, half Hit Dice</small></button>
              <button id="shortRestBtn" class="mm-item" hidden>🌗 Short rest <small>HP via Hit Dice · no PP</small></button>
              <button id="longRestBtn" class="mm-item" hidden>🌙 Long rest <small>full HP, PP, status</small></button>
            </div>
          </span>
        </div>
      </div>

      <!-- Always-expanded, non-collapsible: a spellcaster's slots in the most prominent spot —
           directly above the Roll (advantage/disadvantage) controls, always in view. NOT a
           .section-head, so the collapse wiring skips it; renderSlotBar hides it for non-casters. -->
      <section class="card slots-card" data-section="slots" hidden>
        <div class="slots-row"><span class="section-title">Spell Slots</span><div id="slotBar" class="slot-tracker"></div></div>
      </section>

      <div class="controls">
        <div class="adv-row">
          <div class="seg" id="advSeg" title="Next roll: advantage / disadvantage">
            <button data-adv="super-disadvantage" title="Super-disadvantage — roll 3d20, keep the lowest">S·Dis</button>
            <button data-adv="disadvantage">Dis</button>
            <button data-adv="normal" class="on">Normal</button>
            <button data-adv="advantage">Adv</button>
            <button data-adv="super-advantage" title="Super-advantage — roll 3d20, keep the highest (e.g. advantage + Elven Accuracy)">S·Adv</button>
          </div>
          <label class="ex-mod" title="One-off modifier for your NEXT roll only — a bonus or penalty the sheet can't know about (a DM-granted +2, cover −5, a temporary buff). It resets to 0 after you roll. Leave at 0 normally.">
            <button id="modDown" type="button" class="ex-step" title="−1 to the next roll">−</button>
            <input id="adhocMod" type="number" value="0" step="1" aria-label="One-off modifier for the next roll" />
            <button id="modUp" type="button" class="ex-step" title="+1 to the next roll">+</button>
          </label>
        </div>
        <div class="extras-row">
          <button id="critToggle" type="button" class="ex-toggle" title="Crit: roll your NEXT attack's damage as a critical hit (double the damage dice). Clears after one roll.">💥 Crit</button>
          <button id="whisperToggle" type="button" class="ex-toggle" title="Whisper rolls to the GM only">🔒 Whisper</button>
          <span class="ex-push">
            <button type="button" class="ex-toggle init-btn" data-kind="initiative" title="Roll initiative into Roll20">⚡ Init <span class="mod" id="initMod"></span></button>
            <button id="rerollBtn" type="button" class="ex-toggle" title="Roll the last thing again" disabled>↻ Reroll</button>
          </span>
        </div>
        <input id="search" type="text" placeholder="Search skills, attacks, spells…" />
      </div>

      <section class="card" data-section="hp" hidden>
        <div class="section-head"><span class="tw"></span><span class="section-title">Hit Points</span>
          <span id="hpMeta" class="spell-meta"></span>
          <label class="hp-temp" title="Temporary hit points (a separate buffer that absorbs damage first)">Temp <input id="hpTemp" type="number" min="0" placeholder="0" /></label></div>
        <div class="section-body">
          <div class="hp-bar"><div id="hpFill" class="hp-fill"></div><div id="hpText" class="hp-text"></div></div>
          <div class="hp-controls">
            <input id="hpAmount" type="number" min="0" placeholder="Amt" />
            <select id="hpDamageType" class="hp-dtype" title="Damage type — applies your resistances / immunities / vulnerabilities"><option value="">untyped</option></select>
            <button id="hpDamage" class="mini-btn hp-dmg">− Damage</button>
            <button id="hpHeal" class="mini-btn hp-heal">+ Heal</button>
            <button id="hpUndo" class="mini-btn" title="Undo the last HP change" aria-label="Undo the last HP change" disabled>↶</button>
          </div>
          <div id="defenses" class="defenses"></div>
          <div id="concentration" class="conc-chip" hidden></div>
          <div id="deathSaves" class="death-saves" hidden></div>
        </div>
      </section>

      <section class="card" data-section="attacks" hidden>
        <div class="section-head"><span class="tw"></span><span class="section-title">Attacks</span></div>
        <div class="section-body"><div id="attacks" class="rows"></div></div>
      </section>

      <section class="card" data-section="spells" hidden>
        <div class="section-head">
          <span class="tw"></span><span class="section-title">Spells</span>
          <span id="spellMeta" class="spell-meta"></span>
        </div>
        <div class="section-body"><div id="spells" class="rows"></div></div>
      </section>

      <section class="card" data-section="skills">
        <div class="section-head"><span class="tw"></span><span class="section-title">Skills</span></div>
        <div class="section-body"><div id="skills" class="rows"></div></div>
      </section>

      <section class="card" data-section="saves">
        <div class="section-head"><span class="tw"></span><span class="section-title">Saving Throws</span></div>
        <div class="section-body">
          <div id="saves" class="rows"></div>
        </div>
      </section>

      <section class="card" data-section="abilities">
        <div class="section-head"><span class="tw"></span><span class="section-title">Abilities</span></div>
        <div class="section-body"><div id="abilities" class="abil-grid"></div></div>
      </section>

      <section class="card" data-section="features" hidden>
        <div class="section-head"><span class="tw"></span><span class="section-title">Features &amp; Abilities</span></div>
        <div class="section-body"><div id="features" class="features"></div></div>
      </section>

      <section class="card" data-section="items" hidden>
        <div class="section-head">
          <span class="tw"></span><span class="section-title">Items</span>
          <span id="itemMeta" class="spell-meta"></span>
          <button id="manageItems" class="mini-btn" title="Open D&amp;D Beyond's inventory to search &amp; add items, then re-sync">＋ Add / Manage</button>
          <button id="addPokeItem" class="mini-btn" title="Add an item to this trainer's bag (saves to poke5e)" hidden>＋ Add item</button>
        </div>
        <div class="section-body"><div id="items" class="rows"></div></div>
      </section>

      <section class="card collapsed" data-section="options" hidden>
        <div class="section-head"><span class="tw"></span><span class="section-title">Roll Options</span></div>
        <div class="section-body"><div id="toggles" class="toggles"></div></div>
      </section>

      <section class="card collapsed" data-section="log">
        <div class="section-head">
          <span class="tw"></span><span class="section-title">Session Log</span>
          <span id="logMeta" class="spell-meta"></span>
          <span class="dd head-dd">
            <button class="mini-btn" data-dd="sync" title="Pull rolls from the Roll20 game chat">Sync ▾</button>
            <div id="dd-sync" class="dd-menu" role="menu" hidden>
              <button id="logRefresh" class="mm-item" title="Sync from the Roll20 game chat">⟳ Sync now <small>recent chat</small></button>
              <button id="logDeepSync" class="mm-item" title="Scroll Roll20 to load the most history it will serve, then capture (deduped)">⇊ Full sync <small>all history</small></button>
            </div>
          </span>
          <span class="dd head-dd">
            <button class="mini-btn" data-dd="export" title="Copy, export, or clear the log">Export ▾</button>
            <div id="dd-export" class="dd-menu" role="menu" hidden>
              <button id="logCopy" class="mm-item">📋 Copy to clipboard</button>
              <button id="exportJson" class="mm-item">Export JSON</button>
              <button id="exportCsvLog" class="mm-item">Export CSV <small>rolls</small></button>
              <button id="exportCsvStats" class="mm-item">Export CSV <small>stats</small></button>
              <button id="openRollLogs" class="mm-item" title="Open the durable per-campaign roll archive folder (kept even if you Clear the view)">📁 Open archive folder</button>
              <hr class="mm-sep" />
              <button id="logClear" class="mm-item danger">Clear log</button>
            </div>
          </span>
        </div>
        <div class="section-body">
          <div class="log-controls">
            <select id="logCampaign" title="Show history for a campaign"><option value="__all__">All campaigns</option></select>
            <span class="lc-label">Live</span>
            <div class="seg small" id="liveSeg">
              <button data-live="0" class="on">Off</button>
              <button data-live="5">5s</button>
              <button data-live="15">15s</button>
              <button data-live="30">30s</button>
            </div>
            <select id="logPlayer" title="Filter by player"><option value="">All players</option></select>
            <label class="chk"><input type="checkbox" id="d20Only" /> d20 only</label>
            <label class="chk"><input type="checkbox" id="showGM" /> GM rolls</label>
          </div>
          <div id="statsTable" class="stats"></div>
          <div id="rollLog" class="rolllog"></div>
        </div>
      </section>

      <div id="lastRoll" class="last-roll"></div>
    </div>

    <div id="pokedex" hidden>
     <div class="dex-device">
      <span class="dex-screw tl"></span><span class="dex-screw tr"></span><span class="dex-screw bl"></span><span class="dex-screw br"></span>
      <button id="dexClose" class="dex-close" title="Close (Esc)" aria-label="Close">✕</button>
      <div class="dex-topbar">
        <div class="dex-lens"><i></i></div>
        <div class="dex-leds"><span class="dex-led r"></span><span class="dex-led y"></span><span class="dex-led g"></span></div>
        <div class="dex-wordmark">POKéDEX</div>
        <div class="dex-progress">
          <span>Seen <b id="dexSeen">0</b></span>
          <span>Caught <b id="dexCaught">0</b> / <b id="dexTotal">—</b></span>
          <div class="dex-pbar"><span id="dexBar"></span></div>
        </div>
      </div>
      <div class="dex-filters">
        <div class="dex-search"><input id="dexQ" type="text" placeholder="Search species…" aria-label="Search species" /></div>
        <select id="dexRegion" aria-label="Region"><option value="">All regions</option></select>
        <select id="dexSR" aria-label="SR band">
          <option value="">Any SR</option><option value="lo">SR ≤ 1</option><option value="mid">SR 2–6</option><option value="hi">SR 7+</option>
        </select>
        <select id="dexState" aria-label="Collection">
          <option value="">All</option><option value="caught">Caught</option><option value="seen">Seen</option><option value="unseen">Unseen</option>
        </select>
        <label class="dex-chk" title="Include community-made (unofficial) species"><input type="checkbox" id="dexFakemon" /> Show fakémon</label>
        <label class="dex-chk" title="Only species that learn a sleep move (Sing, Spore, Hypnosis, Yawn…) — pairs with the Dream Ball"><input type="checkbox" id="dexSleep" /> 💤 Sleep move</label>
        <div class="dex-tchips" id="dexTypes"></div>
      </div>
      <div class="dex-body">
        <div class="dex-list" id="dexList" role="listbox" aria-label="Species"></div>
        <div class="dex-detail" id="dexDetail" aria-live="polite"></div>
      </div>
     </div>
    </div>

    <div id="notebook" hidden>
      <div class="nb">
        <aside class="nb-rail">
          <div class="nb-campaign">
            <div class="nb-eyebrow"><span class="nb-dot"></span> Notebook for</div>
            <div class="nb-campname" id="nbCampName">—</div>
            <div class="nb-cid">campaign id · <b id="nbCid">—</b></div>
          </div>
          <div class="nb-pages-head">
            <span>Pages</span>
            <button id="nbNew" class="mini-btn" title="Add a new note page">＋ New</button>
          </div>
          <div class="nb-pagelist" id="nbPages"></div>
          <div class="nb-rail-foot">
            <span>💾 Saved per campaign, on this device</span>
            <button id="nbFolder" class="mini-btn" title="Open the notebook folder">📁</button>
          </div>
        </aside>
        <section class="nb-editor" id="nbEditor"></section>
      </div>
    </div>

    <script src="sheet.js"></script>
  </body>
</html>
